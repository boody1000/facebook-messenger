<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شات بوت محلي ذكي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .chat-box { height: 400px; border: 1px solid #ddd; border-radius: 5px; overflow-y: scroll; padding: 10px; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .user { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .assistant { background: #e2e8f0; color: #333; margin-right: auto; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>مساعدك الذكي المحلي</h2>
        <div id="chat-box" class="chat-box"></div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="checkEnter(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        let history = [];

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const text = inputField.value.trim();
            if (!text) return;

            // عرض رسالة المستخدم
            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // إرسال الطلب للسيرفر
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history })
                });
                const data = await res.json();
                
                // عرض رد المساعد
                chatBox.innerHTML += `<div class="message assistant">${data.response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

                // تحديث الذاكرة
                history.push({ role: "user", content: text });
                history.push({ role: "assistant", content: data.response });
            } catch (err) {
                chatBox.innerHTML += `<div class="message assistant" style="color:red;">حدث خطأ في الاتصال.</div>`;
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
