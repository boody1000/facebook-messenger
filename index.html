<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة السنترال الافتراضي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- الشريط الجانبي للحالة -->
        <aside class="sidebar">
            <h2>لوحة الموظف</h2>
            <div class="agent-status">
                <label>حالتك الآن:</label>
                <select id="statusSelect" onchange="updateAgentStatus()">
                    <option value="online">متصل (جاهز)</option>
                    <option value="busy">مشغول في مكالمة</option>
                    <option value="offline">غير متصل</option>
                </select>
            </div>
            <div class="virtual-number">
                <span>رقم الخدمة:</span>
                <h3>+20 123 456 7890</h3>
            </div>
        </aside>

        <!-- المحتوى الرئيسي للمكالمات والطلبات -->
        <main class="main-content">
            <header>
                <h2>قائمة العملاء المنتظرين</h2>
            </header>
            
            <div class="calls-queue" id="callsQueue">
                <!-- يتم جلب العملاء هنا ديناميكياً من جافاسكريبت -->
                <div class="call-card">
                    <p><strong>اسم العميل:</strong> أحمد محمد</p>
                    <p><strong>رقم الهاتف:</strong> 01012345678</p>
                    <button class="btn-answer" onclick="answerCall('1')">استقبال المكالمة</button>
                </div>
            </div>
        </main>
    </div>

    <!-- ربط Firebase SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
